<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Previsão de pesca à cana – Açores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;600;800&display=swap" rel="stylesheet">
<style>
:root{--g1:#2a7ca3;--g2:#d9822b;--g3:#7a5fc0;--bg:#eef3f1;--card:#fff;--ink:#0d2b36;--mute:#5b717a;--line:#d5e0dc;--track:#dfe8e4;--sel:#0d2b36;--selink:#f1f5f2;
--c1:#2e7d62;--c2:#6f9a3a;--c3:#d9a406;--c4:#d9822b;--c5:#b3412f}
@media (prefers-color-scheme:dark){:root{--g1:#5bb4dc;--g2:#ee9a47;--g3:#a58cf0;--bg:#0a1c23;--card:#11303b;--ink:#e6efec;--mute:#93a9b0;--line:#1f4350;--track:#1b3d49;--sel:#e6efec;--selink:#0a1c23;
--c1:#4fb08c;--c2:#93bd5c;--c3:#f2b705;--c4:#ee9a47;--c5:#e0715e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Bricolage Grotesque",system-ui,sans-serif}
main{max-width:1040px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between;margin-bottom:20px}
h1{margin:0;font-size:1.7rem;font-weight:800;letter-spacing:-.02em}
header p{margin:2px 0 0;color:var(--mute);font-size:.9rem}
.ctrl{display:flex;gap:8px}
select,button.rf{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
button.rf{cursor:pointer}
:focus-visible{outline:3px solid var(--c3);outline-offset:2px}
.grid{display:grid;gap:16px}
@media(min-width:820px){.grid{grid-template-columns:320px 1fr;align-items:start}}
.dias{display:flex;flex-direction:column;gap:6px}
.dia{display:grid;grid-template-columns:78px 1fr 52px;gap:10px;align-items:center;text-align:left;width:100%;font:inherit;color:inherit;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;cursor:pointer}
.dia[aria-pressed=true]{background:var(--sel);color:var(--selink);border-color:var(--sel)}
.dia b{display:block;text-transform:capitalize;font-weight:600;line-height:1.2}
.dia small{opacity:.7}
.dia .pc{font-weight:800;font-size:1.25rem;text-align:right}
.bar{height:8px;background:var(--track);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:4px}
.melhor{display:inline-block;margin-left:4px;font-size:.7rem;font-weight:600;background:var(--c3);color:#0d2b36;border-radius:4px;padding:0 5px}
.painel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.topo{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:8px}
.topo h2{margin:0;font-size:1.3rem;text-transform:capitalize}
.topo p{margin:2px 0 0;color:var(--mute)}
.big{font-size:3.6rem;font-weight:800;line-height:1;letter-spacing:-.03em;color:var(--c)}
.big small{font-size:1.3rem;font-weight:600}
.big span{display:block;font-size:.95rem;font-weight:600;letter-spacing:0;text-align:right}
.aviso{margin:12px 0 0;padding:10px 12px;border-left:4px solid var(--c5);background:var(--track);border-radius:0 8px 8px 0;font-size:.92rem}
.resumo{margin:12px 0 4px}
.mod{padding:14px 0;border-bottom:1px solid var(--line)}
.mod:last-child{border:0}
.mh{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:6px}
.mh h3{margin:0;font-size:1rem}
.mh h3 small{font-weight:400;color:var(--mute)}
.mh strong{font-size:1.05rem;color:var(--c)}
.val{margin:6px 0 0;font-size:.88rem;color:var(--mute)}
.nota{margin:2px 0 0;font-size:.92rem}
svg.sp{display:block;margin-top:6px;width:100%;max-width:260px;height:36px}
.pers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 6px}
.per{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:.85rem}
.per.top{border:2px solid var(--c);padding:7px 9px}
.per small{color:var(--mute)}
.per span{font-weight:800;font-size:1.25rem;color:var(--c)}
.tira{display:grid;grid-template-columns:repeat(24,1fr);gap:1px;margin-top:10px}
.tira i{height:20px}
.eixo{display:flex;justify-content:space-between;font-size:.72rem;color:var(--mute)}
.calib{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;font-size:.88rem;color:var(--mute)}
.calib input{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.mod>summary{list-style:none;cursor:pointer}
.mod>summary::-webkit-details-marker{display:none}
.ver{display:inline-block;margin-top:4px;font-size:.82rem;font-weight:600;color:var(--g1)}
.ver::after{content:" ▾"}
.mod[open] .ver::after{content:" ▴"}
.fig{margin:14px 0 4px}
.fig figcaption{font-weight:600;font-size:.9rem;margin-bottom:4px}
.graf{display:block;width:100%;height:auto}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;margin:4px 0;font-size:.8rem;color:var(--mute)}
.leg i{display:inline-block;width:12px;height:12px;margin-right:5px;border-radius:3px;vertical-align:-2px}
.mapa{margin:0 0 16px}
.mapa summary{cursor:pointer;font-weight:600;margin-bottom:8px}
.mapa svg{display:block;width:100%;height:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
.mapa .ilha{fill:var(--track);stroke:var(--mute);stroke-width:.6;stroke-linejoin:round}
.mapa .pt{cursor:pointer}
.mapa text{font-size:9px;fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:2.5px}
.m{display:block}
.m small{display:block;margin-bottom:3px;font-size:.78rem}
.m .bar{display:block}
.estado{color:var(--mute);font-size:.85rem;margin-top:16px}
.erro{padding:16px;border:1px solid var(--c5);border-radius:10px;background:var(--card)}
</style>
</head>
<body>
<main>
<header>
  <div>
    <h1>Pesca à cana nos Açores</h1>
    <p>Qualidade prevista por dia, calculada a partir de vários fatores meteorológicos e do mar.</p>
  </div>
  <div class="ctrl">
    <select id="ilha" aria-label="Ilha"></select>
    <select id="local" aria-label="Local de pesca"></select>
    <button class="rf" id="rf" type="button">Atualizar</button>
  </div>
</header>
<details class="mapa" id="mapa" open></details>
<div id="app" class="grid" aria-live="polite"><p>A carregar previsão…</p></div>
<p class="estado" id="estado"></p>
<div class="calib">
  <label>Calibrar marés: hora oficial de uma preia-mar de hoje <input type="time" id="hora"></label>
  <button class="rf" id="cal" type="button">Calibrar</button>
  <button class="rf" id="rep" type="button">Repor valor predefinido</button>
  <span id="desf"></span>
</div>
</main>

<script>
/* ---------- Configuração ---------- */
const ILHAS={
 "Santa Maria":[36.96,-25.09],"São Miguel":[37.78,-25.50],"Terceira":[38.72,-27.22],
 "Graciosa":[39.05,-28.00],"São Jorge":[38.65,-28.05],"Pico":[38.47,-28.32],
 "Faial":[38.58,-28.70],"Flores":[39.45,-31.13],"Corvo":[39.70,-31.11]};
// Locais por ilha: [nome, lat, lon, face]. face = direção para onde a costa está virada (0=N, 90=E, 180=S, 270=O).
// Coordenadas e orientações aproximadas: ajuste-as à vontade. Para acrescentar locais a outra ilha, junte uma linha aqui.
const LOCAIS={"Terceira":[
 ["Praia da Vitória",38.733,-27.067,90],["Porto Martins",38.755,-27.055,80],["Lages",38.756,-27.090,110],
 ["Porto Judeu",38.678,-27.128,170],["Angra do Heroísmo",38.655,-27.220,180],["São Bartolomeu",38.667,-27.283,190],
 ["Cinco Ribeiras",38.700,-27.360,225],["Serreta",38.765,-27.365,315],["Biscoitos",38.790,-27.240,350],["Quatro Ribeiras",38.770,-27.155,20]]};
// Porto de referência de cada ilha e concordância do IH face a esse porto: [porto, diferença de hora em min, fator de altura].
// Santa Maria e São Miguel têm porto próprio; Graciosa segue Angra; São Jorge, Pico e Faial seguem a Horta; Corvo segue as Lajes das Flores.
const MARE_ILHA={"Santa Maria":["Vila do Porto",0,1],"São Miguel":["Ponta Delgada",0,1],"Terceira":["Angra do Heroísmo",0,1],
 "Graciosa":["Angra do Heroísmo",11,1.08],"São Jorge":["Horta",6,1.07],"Pico":["Horta",1,1.05],"Faial":["Horta",0,1],
 "Flores":["Lajes das Flores",-4,.98],"Corvo":["Lajes das Flores",-1,1]};
const CONC={"Praia da Vitória":[11,1.10]}; // locais com concordância própria no IH
const locaisDe=i=>{const[po,df,ft]=MARE_ILHA[i];return[["Toda a ilha (geral)",...ILHAS[i],null,df,ft,po],...(FREG[i]||LOCAIS[i]||[]).map(l=>[...l.slice(0,4),CONC[l[4]??l[0]]?.[0]??df,CONC[l[4]??l[0]]?.[1]??ft,po])]};
const HORAS=Array.from({length:24},(_,i)=>i); // dia completo (00h-23h): também se pesca à noite
const JANELA=12; // horas anteriores usadas para medir a tendência da pressão

/* ---------- Utilitários ---------- */
const $=s=>document.querySelector(s);
const vals=a=>a.filter(x=>x!=null);
const avg=a=>{a=vals(a);return a.length?a.reduce((s,x)=>s+x,0)/a.length:null};
const mx=a=>{a=vals(a);return a.length?Math.max(...a):null};
const sm=a=>{a=vals(a);return a.length?a.reduce((s,x)=>s+x,0):null};
const clamp=x=>Math.max(0,Math.min(100,x));
const f=(x,n=0)=>x==null?'–':x.toFixed(n).replace('.',',');
function interp(x,t){
  if(x<=t[0][0])return t[0][1];
  for(let i=1;i<t.length;i++){if(x<=t[i][0]){const[a,b]=t[i-1],[c,d]=t[i];return b+(d-b)*(x-a)/(c-a)}}
  return t[t.length-1][1];
}
function tier(s){
  if(s>=80)return{n:'Excelente',c:'var(--c1)'};
  if(s>=65)return{n:'Boa',c:'var(--c2)'};
  if(s>=50)return{n:'Razoável',c:'var(--c3)'};
  if(s>=35)return{n:'Fraca',c:'var(--c4)'};
  return{n:'Má',c:'var(--c5)'};
}
function spark(a){
  const v=vals(a);if(v.length<2)return'';
  const lo=Math.min(...v),hi=Math.max(...v),r=(hi-lo)||1;
  const pts=v.map((y,i)=>`${(i/(v.length-1)*256+2).toFixed(1)},${(32-(y-lo)/r*28).toFixed(1)}`).join(' ');
  return `<svg class="sp" viewBox="0 0 260 36" role="img" aria-label="Pressão ao longo do dia"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>`;
}
function faseLunar(dia){
  const ciclo=29.530588853,d=(new Date(dia+'T12:00:00Z')-Date.UTC(2000,0,6,18,14))/864e5;
  return (((d%ciclo)+ciclo)%ciclo)/ciclo;
}
function nomeFase(p){
  if(p<.03||p>.97)return'Lua nova';if(p<.22)return'Lua crescente';if(p<.28)return'Quarto crescente';
  if(p<.47)return'Crescente gibosa';if(p<.53)return'Lua cheia';if(p<.72)return'Minguante gibosa';
  if(p<.78)return'Quarto minguante';return'Lua minguante';
}

/* ---------- Marés: análise harmónica dos portos principais dos Açores ----------
   Constantes ajustadas às previsões da Tabela de Marés 2026 do Instituto Hidrográfico (hora TU, alturas ao zero hidrográfico, nível médio 1,00 m).
   nível = 1 + fator·Σ(a·cos(ωt) + b·sin(ωt)), com t em horas desde 2026-01-01 00:00 UTC e ω em graus/hora. Cada linha: [ω, a, b]. */
const MARES={
 "Vila do Porto":[[28.9841042,0.4952,-0.0327],[30.0,0.0226,0.1769],[28.4397295,0.0966,-0.0201],[30.0821373,-0.0369,-0.0477],[27.8953548,0.0121,-0.003],[27.9682084,-0.0059,-0.0261],[28.5125831,0.0005,-0.0183],[29.5284789,-0.007,-0.0028],[29.9589333,0.0022,0.0096],[15.0410686,0.0211,0.0326],[13.9430356,-0.0006,-0.0279],[14.9589314,0.0037,0.0099],[13.3986609,-0.0053,-0.0042],[57.9682084,0.0015,0.0001],[58.9841042,-0.0003,0.0003],[57.4238337,0.0006,-0.0011],[86.9523127,-0.008,0.0025],[87.9682084,-0.001,-0.0035]],
 "Ponta Delgada":[[28.9841042,0.4792,-0.0176],[30.0,0.0169,0.1715],[28.4397295,0.0946,-0.0162],[30.0821373,-0.0355,-0.0507],[27.8953548,0.0118,-0.001],[27.9682084,-0.0072,-0.0241],[28.5125831,0.0013,-0.0194],[29.5284789,-0.0098,-0.0017],[29.9589333,0.0016,0.0101],[15.0410686,0.0257,0.0357],[13.9430356,-0.001,-0.028],[14.9589314,0.003,0.0104],[13.3986609,-0.0057,-0.0049],[57.9682084,0.003,-0.0014],[58.9841042,0.0002,0.0007],[57.4238337,0.0011,-0.0014],[86.9523127,-0.0064,0.0022],[87.9682084,-0.0007,-0.002]],
 "Angra do Heroísmo":[[28.9841042,0.435,-0.0073],[30.0,0.012,0.1601],[28.4397295,0.0862,-0.0141],[30.0821373,-0.0302,-0.0455],[27.8953548,0.014,-0.0016],[27.9682084,-0.0049,-0.0243],[28.5125831,0.0013,-0.0156],[29.5284789,-0.0088,-0.003],[29.9589333,0.0024,0.008],[15.0410686,0.022,0.0373],[13.9430356,0.0029,-0.0241],[14.9589314,0.0026,0.0123],[13.3986609,-0.0069,-0.0051],[57.9682084,0.0024,-0.0023],[58.9841042,-0.0008,0.0001],[57.4238337,-0.0001,-0.0],[86.9523127,-0.0043,0.0005],[87.9682084,-0.0001,-0.0011]],
 "Horta":[[28.9841042,0.4141,-0.0506],[30.0,0.0312,0.1446],[28.4397295,0.0753,-0.0215],[30.0821373,-0.0328,-0.0385],[27.8953548,0.0097,-0.0025],[27.9682084,-0.0082,-0.0233],[28.5125831,-0.0004,-0.0143],[29.5284789,-0.0066,-0.0013],[29.9589333,0.0033,0.0073],[15.0410686,0.014,0.0403],[13.9430356,0.0011,-0.0202],[14.9589314,0.0004,0.0113],[13.3986609,-0.0085,-0.0043],[57.9682084,0.0041,-0.0023],[58.9841042,0.0004,0.0014],[57.4238337,0.0013,-0.0021],[86.9523127,-0.0084,0.0039],[87.9682084,-0.0014,-0.003]],
 "Lajes das Flores":[[28.9841042,0.3597,-0.0341],[30.0,0.0245,0.1285],[28.4397295,0.0722,-0.0182],[30.0821373,-0.0296,-0.0354],[27.8953548,0.0086,-0.0054],[27.9682084,-0.0055,-0.0181],[28.5125831,0.0007,-0.0147],[29.5284789,-0.0065,-0.0022],[29.9589333,0.0009,0.0054],[15.0410686,0.0067,0.0327],[13.9430356,0.0016,-0.0158],[14.9589314,-0.002,0.0084],[13.3986609,-0.0042,-0.0041],[57.9682084,0.0035,0.0002],[58.9841042,-0.0013,0.0012],[57.4238337,-0.0,0.0001],[86.9523127,-0.0037,0.0009],[87.9682084,-0.0004,-0.0013]]};
const MARE_T0=Date.UTC(2026,0,1);
function nivelMare(ms,fator,porto){
  const t=(ms-MARE_T0)/36e5;let h=0;
  for(const[w,a,b]of MARES[porto]){const x=w*Math.PI/180*t;h+=a*Math.cos(x)+b*Math.sin(x)}
  return 1+fator*h;
}
function t0Dia(data){ // meia-noite local dos Açores, em ms UTC
  const m=new Date(data+'T12:00:00Z'),loc=new Date(m.toLocaleString('sv-SE',{timeZone:'Atlantic/Azores'}).replace(' ','T')+'Z');
  return Date.UTC(+data.slice(0,4),+data.slice(5,7)-1,+data.slice(8,10))-(loc-m);
}

/* ---------- Solunar e marés ---------- */
const PERIODOS=[['Madrugada',0,6],['Manhã',6,12],['Tarde',12,18],['Noite',18,24]];
const hm=m=>{m=Math.round(Math.max(0,Math.min(1439,m)));return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
// Posição aproximada da Lua (fórmulas simplificadas, erro de alguns minutos). Maior = passagem meridiana ±60 min; menor = nascer/pôr ±30 min.
function solunar(data,lat,lon){
  const R=Math.PI/180,meio=new Date(data+'T12:00:00Z');
  const loc=new Date(meio.toLocaleString('sv-SE',{timeZone:'Atlantic/Azores'}).replace(' ','T')+'Z');
  const t0=Date.UTC(+data.slice(0,4),+data.slice(5,7)-1,+data.slice(8,10))-(loc-meio);
  const alt=m=>{
    const d=(t0+m*6e4)/864e5-10957.5;
    const lam=(218.316+13.176396*d+6.289*Math.sin((134.963+13.064993*d)*R))*R;
    const bet=5.128*Math.sin((93.272+13.22935*d)*R)*R,eps=(23.4393-3.563e-7*d)*R;
    const x=Math.cos(lam)*Math.cos(bet),y=Math.sin(lam)*Math.cos(bet)*Math.cos(eps)-Math.sin(bet)*Math.sin(eps),z=Math.sin(lam)*Math.cos(bet)*Math.sin(eps)+Math.sin(bet)*Math.cos(eps);
    const H=(280.46061837+360.98564736629*d+lon)*R-Math.atan2(y,x),dec=Math.asin(z);
    return Math.asin(Math.sin(lat*R)*Math.sin(dec)+Math.cos(lat*R)*Math.cos(dec)*Math.cos(H));
  };
  const A=[];for(let m=0;m<=1440;m+=10)A.push(alt(m));
  const janelas=[];
  for(let i=1;i<A.length-1;i++){
    const m=i*10;
    if((A[i]>A[i-1]&&A[i]>=A[i+1])||(A[i]<A[i-1]&&A[i]<=A[i+1]))janelas.push({ini:m-60,fim:m+60,tipo:'maior'});
    if((A[i-1]<0&&A[i]>=0)||(A[i-1]>=0&&A[i]<0))janelas.push({ini:m-30,fim:m+30,tipo:'menor'});
  }
  return{janelas:janelas.sort((a,b)=>a.ini-b.ini)};
}
// Nível do mar à hora t (relativa ao início do dia), por interpolação linear; c[i] = hora i-2
const nivel=(c,t)=>{const x=t+2,i=Math.floor(x),a=c?.[i],b=c?.[i+1];return i<0||a==null||b==null?null:a+(b-a)*(x-i)};
// Preia-mar e baixa-mar: máximos e mínimos da série (interpolação parabólica) + desfasamento d.desf (min) face à tabela oficial
function extremos(d){
  const c=d.mareCtx,r=[];if(!c)return r;
  for(let j=-1;j<=24;j++){
    const y0=nivel(c,j-1),y1=nivel(c,j),y2=nivel(c,j+1);if(y0==null||y1==null||y2==null)continue;
    const alta=y1>y0&&y1>=y2,baixa=y1<y0&&y1<=y2;if(!alta&&!baixa)continue;
    const den=y0-2*y1+y2,m=(j+(den?.5*(y0-y2)/den:0))*60+(d.desf||0);
    if(m>=0&&m<1440)r.push({m,alta,y:y1});
  }
  return r.sort((a,b)=>a.m-b.m);
}
// Pontuação hora a hora: água em movimento (velocidade da maré) + períodos solunares, com bónus quando coincidem
function horaMares(d){
  const c=d.mareCtx,o=(d.desf||0)/60;
  return HORAS.map(h=>{
    const a=nivel(c,h+1-o),b=nivel(c,h-1-o),sp=a!=null&&b!=null?Math.abs(a-b)/2:null;
    const base=sp==null?60:interp(sp,[[0,35],[.05,50],[.12,80],[.2,100]]);
    const s=d.sol.janelas.filter(j=>h*60+30>=j.ini&&h*60+30<=j.fim).reduce((a,j)=>Math.max(a,j.tipo==='maior'?1:.6),0);
    const mid=h*60+30,ds=d.sun?Math.min(Math.abs(mid-d.sun.nasce),Math.abs(mid-d.sun.poe)):999;
    const u=ds<=45?1:ds<=90?.5:0; // luz de amanhecer e entardecer
    return clamp(base*.5+(40+60*s)*.3+(40+60*u)*.2+((s>0||u>0)&&base>=70?10:0));
  });
}
// Janelas de ouro: período solunar a menos de 1 h de uma preia-mar ou baixa-mar
function ouro(d){
  const r=[];
  [...d.sol.janelas,...(d.sun?[d.sun.nasce,d.sun.poe].map(m=>({ini:m-60,fim:m+60})):[])].forEach(j=>d.extremos.forEach(e=>{const a=Math.max(j.ini,e.m-60),b=Math.min(j.fim,e.m+60);if(b>a)r.push({a,b})}));
  return r.sort((x,y)=>x.a-y.a);
}
function tira(d){
  return`<div class="tira">${d.hs.map((v,h)=>`<i title="${String(h).padStart(2,'0')}h: ${Math.round(v)}%" style="background:${tier(v).c}"></i>`).join('')}</div><div class="eixo"><span>00h</span><span>06h</span><span>12h</span><span>18h</span><span>24h</span></div>`;
}

/* ---------- Módulos (um por fator) ----------
   Cada módulo recebe os dados do dia e devolve {pontos 0-100, valor, nota} ou null se não houver dados.
   Para acrescentar um fator, basta juntar um objeto a esta lista. */
const MODULOS=[
{id:'pressao',nome:'Pressão atmosférica',peso:.20,avaliar(d){
  const a=vals(d.p),c=d.pCtx;if(a.length<4)return null;
  // tendência: para cada hora do dia, variação face às JANELA horas anteriores; depois média do dia
  const ds=[];for(let i=JANELA;i<c.length;i++)if(c[i]!=null&&c[i-JANELA]!=null)ds.push(c[i]-c[i-JANELA]);
  if(ds.length<4)return null;
  const delta=avg(ds),pm=avg(a);
  const seta=delta<-1?'↓':delta>1?'↑':'→';
  let s=interp(delta,[[-12,30],[-6,50],[-3,100],[-1,92],[0,75],[1,62],[3,50],[6,35]]);
  if(pm<1000)s-=15;else if(pm<1008)s-=7;
  const nota=delta<-6?'Queda rápida: frente a chegar. Peixe ativo, mas o mar vai piorar.'
   :delta<-1?'Queda gradual: cenário clássico de boa atividade antes da frente.'
   :delta<=1?'Pressão estável: pesca regular, peixe menos agitado.'
   :delta<=4?'Subida ligeira: pós-frente, atividade a recuperar.'
   :'Subida rápida: água turva e peixe irregular.';
  return{pontos:clamp(s),valor:`${f(pm)} hPa, tendência ${seta} ${delta>0?'+':''}${f(delta,1)} hPa por cada ${JANELA} h`,nota};
}},
{id:'ondulacao',nome:'Ondulação',peso:.26,avaliar(d){
  const h=avg(d.onda);if(h==null)return null;
  const hm=mx(d.onda),per=avg(d.per);
  const s=interp(hm,[[0,75],[.3,82],[.8,100],[1.5,88],[2,58],[3,22],[4,5],[5,0]]);
  const nota=hm<.3?'Mar chão: peixe mais desconfiado, use fio fino.'
   :hm<1.5?'Ondulação ideal: mexe o fundo sem pôr em risco a margem.'
   :hm<2.2?'Ondulação já forte: escolha locais abrigados.'
   :'Ondulação perigosa na margem: evite os rochedos expostos.';
  return{pontos:clamp(s),valor:`${dirMedia(d.od,d.ondaLargo||d.onda)!=null?`Ondas de ${lado(dirMedia(d.od,d.ondaLargo||d.onda))}. `:''}Máx. ${f(hm,1)} m no local${d.ondaLargo?` (ao largo ${f(mx(d.ondaLargo),1)} m)`:''}, período médio ${f(per,0)} s`,nota};
}},
{id:'vento',nome:'Vento',peso:.20,avaliar(d){
  const v=avg(d.v);if(v==null)return null;
  const r=mx(d.raj),vr=avg(d.vRaw||d.v),dv=dirMedia(d.vd,d.vRaw||d.v);
  let s=interp(v,[[0,95],[10,100],[20,72],[30,40],[45,10],[60,0]]);
  s-=Math.max(0,((r??v)-v-15)*.8);
  const nota=v<12?'Vento fraco: lançamentos fáceis e linha controlada.'
   :v<25?'Vento moderado: aceitável, procure abrigo.'
   :'Vento forte: lançar e sentir a ferrada fica difícil.';
  return{pontos:clamp(s),valor:`${dv!=null?`Vento de ${lado(dv)}, `:''}média ${f(vr)} km/h${Math.abs(vr-v)>.5?` (no local, com abrigo: ${f(v)} km/h)`:''}, rajadas até ${f(r)} km/h`,nota};
}},
{id:'mares',nome:'Marés, solunar e luz do dia',peso:.16,avaliar(d){
  const s=avg(d.hs.slice(d.h0,d.h1));if(s==null)return null;
  const full=d.h1-d.h0===24,tem=d.extremos.length>0;
  let extra='';
  if(full){
    const ex=d.extremos.map(e=>`${e.alta?'preia-mar':'baixa-mar'} ${hm(e.m)} (${e.y>0&&!d.modeloMare?'+':''}${f(e.y,1)} m)`).join('; ');
    const sl=t=>d.sol.janelas.filter(j=>j.tipo===t).map(j=>`${hm(j.ini)}–${hm(j.fim)}`).join(' e ')||'nenhum';
    const og=d.ouro.map(o=>`${hm(o.a)}–${hm(o.b)}`).join('; ');
    extra=`<p class="val">Sol: nasce às ${hm(d.sun.nasce)} e põe-se às ${hm(d.sun.poe)}.</p><p class="val">Marés: ${ex||'sem dados'}.</p><p class="val">Solunar maior: ${sl('maior')}. Menor: ${sl('menor')}.</p>
     <p class="nota">${og?`Janelas de ouro (solunar ou nascer/pôr do sol junto à mudança de maré): <b>${og}</b>.`:'Neste dia não há coincidência com a mudança de maré.'}</p>
     <p class="val">${d.modeloMare?`Marés calculadas com a análise harmónica do Instituto Hidrográfico (Tabela de Marés 2026, porto de ${d.modeloMare}${d.desf?`, com ${d.desf>0?'+':''}${d.desf} min de concordância ou calibração`:''}), em hora dos Açores; alturas ao zero hidrográfico.`:`Horas das marés estimadas pelo modelo do Open-Meteo e corrigidas com um ajuste de ${d.desf>0?'+':''}${d.desf||0} min; use «Calibrar» para o afinar com a tabela oficial.`} Horas da Lua calculadas de forma aproximada.</p>`;
  }
  return{pontos:s,valor:`${nomeFase(faseLunar(d.data))}`,
   nota:tem?'Pesca-se melhor com a água em movimento, sobretudo dentro de um período solunar.':'Sem dados de maré: pontuação baseada só nos períodos solunares.',extra};
}},
{id:'ceu',nome:'Céu e chuva',peso:.12,avaliar(d){
  const n=avg(d.nuv),c=sm(d.chuva);if(n==null)return null;
  const sn=interp(n,[[0,72],[40,95],[80,95],[100,78]]);
  const sc=interp(c??0,[[0,100],[1,80],[5,45],[12,15],[25,0]]);
  return{pontos:clamp(.4*sn+.6*sc),valor:`Nuvens ${f(n)}%, chuva ${f(c,1)} mm`,
   nota:c>5?'Chuva relevante: turva a água e torna a pesca desconfortável.':n>=40&&n<=85?'Céu parcialmente nublado: boa luminosidade para pescar.':'Condições de luz sem grande efeito.'};
}},
{id:'agua',nome:'Temperatura da água',peso:.06,avaliar(d){
  const t=avg(d.sst);if(t==null)return null;
  const s=interp(t,[[12,30],[15,55],[17,80],[19,100],[23,100],[25,80],[28,55]]);
  return{pontos:clamp(s),valor:`${f(t,1)} °C`,nota:t<17?'Água fria: peixe mais lento e junto ao fundo.':t>24?'Água muito quente: peixe procura zonas mais fundas.':'Temperatura favorável.'};
}}
];

/* ---------- Gráficos SVG ---------- */
// o.s: séries {v, h0 (hora do 1.º valor), dx (passo em horas), c (cor), t:'barra', area, dash, semPontos}
// opções: titulo, min, max, dec, un, x0, x1, H, bandas [{a,b,c,o}] (horas), refs [{y,n}], pontos [{h,v,n,c,baixo}], marcas [{h,n,c}], faixa [24 pontuações], leg [{c,n}]
function grafico(o){
  const W=640,H=o.H||230,L=46,Rr=14,T=22,B=o.faixa?46:26,x0=o.x0??0,x1=o.x1??24,b=H-B;
  const tod=o.s.flatMap(s=>vals(s.v)).concat((o.refs||[]).map(r=>r.y));
  let lo=o.min??Math.min(...tod),hi=o.max??Math.max(...tod);
  if(hi-lo<1e-6)hi=lo+1;
  const pd=(hi-lo)*.1;if(o.min==null)lo-=pd;if(o.max==null)hi+=pd;
  const X=h=>L+(h-x0)/(x1-x0)*(W-L-Rr),Y=v=>T+(1-(v-lo)/(hi-lo))*(b-T),r1=n=>n.toFixed(1);
  let g='';
  (o.bandas||[]).forEach(z=>{const a=Math.max(z.a,x0),e=Math.min(z.b,x1);if(e>a)g+=`<rect x="${r1(X(a))}" y="${T}" width="${r1(X(e)-X(a))}" height="${b-T}" fill="${z.c}" opacity="${z.o??.15}"/>`});
  for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4;g+=`<line x1="${L}" x2="${W-Rr}" y1="${r1(Y(v))}" y2="${r1(Y(v))}" stroke="var(--line)"/><text x="${L-6}" y="${r1(Y(v)+4)}" text-anchor="end" fill="var(--mute)" font-size="11">${f(v,o.dec??1)}</text>`}
  for(let h=Math.ceil(x0/6)*6;h<=x1;h+=6)g+=`<text x="${r1(X(h))}" y="${b+14}" text-anchor="middle" fill="var(--mute)" font-size="11">${String(((h%24)+24)%24).padStart(2,'0')}h</text>`;
  (o.refs||[]).forEach(r=>{g+=`<line x1="${L}" x2="${W-Rr}" y1="${r1(Y(r.y))}" y2="${r1(Y(r.y))}" stroke="var(--c5)" stroke-dasharray="5 4"/><text x="${W-Rr-2}" y="${r1(Y(r.y)-4)}" text-anchor="end" fill="var(--c5)" font-size="11">${r.n}</text>`});
  o.s.forEach(s=>{
    const dx=s.dx||1,h0=s.h0??0,pts=s.v.map((v,i)=>v==null?null:[X(h0+i*dx),Y(v),v,h0+i*dx]).filter(Boolean);
    if(!pts.length)return;
    const tip=p=>`${hm(((p[3]%24)+24)%24*60)}: ${f(p[2],o.dec??1)} ${o.un||''}`;
    if(s.t==='barra'){const w=Math.max(2,(X(1)-X(0))*.7);pts.forEach(p=>{g+=`<rect x="${r1(p[0]-w/2)}" y="${r1(p[1])}" width="${r1(w)}" height="${r1(Math.max(0,b-p[1]))}" fill="${s.c}" opacity=".85"><title>${tip(p)}</title></rect>`});return}
    const l=pts.map(p=>r1(p[0])+','+r1(p[1])).join(' ');
    if(s.area)g+=`<polygon points="${r1(pts[0][0])},${b} ${l} ${r1(pts[pts.length-1][0])},${b}" fill="${s.c}" opacity=".18"/>`;
    g+=`<polyline points="${l}" fill="none" stroke="${s.c}" stroke-width="2.2" stroke-linejoin="round"${s.dash?' stroke-dasharray="6 4"':''}/>`;
    if(!s.semPontos)pts.forEach(p=>{g+=`<circle cx="${r1(p[0])}" cy="${r1(p[1])}" r="6" fill="${s.c}" opacity="0"><title>${tip(p)}</title></circle>`});
  });
  (o.marcas||[]).forEach((m,i)=>{const x=X(m.h);g+=`<line x1="${r1(x)}" x2="${r1(x)}" y1="${T}" y2="${b}" stroke="${m.c}" stroke-dasharray="2 3"/><text x="${r1(x+(x>W-90?-3:3))}" y="${T+11+(i%2)*12}" text-anchor="${x>W-90?'end':'start'}" fill="${m.c}" font-size="11">${m.n}</text>`});
  (o.pontos||[]).forEach(p=>{const x=X(p.h),y=Y(p.v);g+=`<circle cx="${r1(x)}" cy="${r1(y)}" r="4.5" fill="var(--card)" stroke="${p.c}" stroke-width="2"/><text x="${r1(x)}" y="${r1(y+(p.baixo?17:-9))}" text-anchor="middle" fill="var(--ink)" font-size="11" font-weight="600">${p.n}</text>`});
  if(o.faixa){g+=`<text x="${L-6}" y="${b+34}" text-anchor="end" fill="var(--mute)" font-size="10">pont.</text>`;o.faixa.forEach((v,h)=>{g+=`<rect x="${r1(X(h))}" y="${b+24}" width="${r1(X(1)-X(0)-1)}" height="11" fill="${tier(v).c}"><title>${String(h).padStart(2,'0')}h: ${Math.round(v)}%</title></rect>`})}
  const leg=(o.leg||[]).map(x=>`<span><i style="background:${x.c}"></i>${x.n}</span>`).join('');
  return`<figure class="fig"><figcaption>${o.titulo}</figcaption><svg class="graf" viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.titulo}">${g}</svg>${leg?`<div class="leg">${leg}</div>`:''}</figure>`;
}
const G={a:'var(--g1)',b:'var(--g2)',c:'var(--g3)'};
const DET={
 pressao:d=>grafico({titulo:'Pressão ao nível do mar (hPa), com as 12 h anteriores',s:[{v:d.pCtx,h0:-12,c:G.a,area:1}],x0:-12,dec:0,un:'hPa',bandas:[{a:-12,b:0,c:'var(--ink)',o:.07}],leg:[{c:'var(--ink)',n:'Sombreado: dia anterior (base da tendência)'}]}),
 ondulacao:d=>grafico({titulo:'Altura das ondas (m)',s:[{v:d.onda,c:G.a,area:1},...(d.ondaLargo?[{v:d.ondaLargo,c:G.b,dash:1,semPontos:1}]:[])],min:0,un:'m',refs:[{y:2.2,n:'risco nas rochas'},{y:3,n:'perigoso'}],leg:[{c:G.a,n:'No local'},...(d.ondaLargo?[{c:G.b,n:'Ao largo'}]:[])]})+setasOnda(d),
 vento:d=>grafico({titulo:'Vento (km/h)',s:[{v:d.v,c:G.a,area:1},{v:d.raj,c:G.b,dash:1,semPontos:1}],min:0,dec:0,un:'km/h',refs:[{y:30,n:'vento forte'},{y:50,n:'rajadas perigosas'}],leg:[{c:G.a,n:'Vento médio'},{c:G.b,n:'Rajadas'}]})+setasVento(d),
 ceu:d=>grafico({titulo:'Nebulosidade (%)',s:[{v:d.nuv,c:G.a,area:1}],min:0,max:100,dec:0,un:'%',H:150})+grafico({titulo:'Precipitação (mm por hora)',s:[{v:d.chuva,c:G.a,t:'barra'}],min:0,un:'mm',H:150}),
 agua:d=>grafico({titulo:'Temperatura da água do mar (°C)',s:[{v:d.sst,c:G.b,area:1}],un:'°C'}),
 mares:d=>{
  if(!d.extremos.length)return'<p class="val">Sem dados de maré para desenhar o gráfico.</p>';
  const o=(d.desf||0)/60,sn=d.sun,h=m=>m/60;
  return grafico({titulo:'Maré, períodos solunares e luz do dia',
   s:[{v:Array.from({length:97},(_,i)=>nivel(d.mareCtx,i*.25-o)),dx:.25,c:G.a,area:1,semPontos:1}],un:'m',
   bandas:[...(sn?[{a:0,b:h(sn.nasce),c:'var(--ink)',o:.1},{a:h(sn.poe),b:24,c:'var(--ink)',o:.1}]:[]),...d.sol.janelas.map(j=>({a:h(j.ini),b:h(j.fim),c:G.c,o:j.tipo==='maior'?.32:.16}))],
   pontos:d.extremos.map(e=>({h:h(e.m),v:e.y,n:`${e.alta?'PM':'BM'} ${hm(e.m)}`,c:G.a,baixo:!e.alta})),
   marcas:sn?[{h:h(sn.nasce),n:`nascer ${hm(sn.nasce)}`,c:'var(--c3)'},{h:h(sn.poe),n:`pôr ${hm(sn.poe)}`,c:'var(--c3)'}]:[],
   faixa:d.hs,
   leg:[{c:G.a,n:'Altura da maré (PM preia-mar, BM baixa-mar)'},{c:G.c,n:'Solunar (forte: maior, claro: menor)'},{c:'var(--ink)',n:'Noite'},{c:'var(--c3)',n:'Nascer e pôr do sol'},{c:'var(--c2)',n:'Faixa inferior: pontuação de cada hora'}]});
 }};
MODULOS.forEach(m=>m.det=DET[m.id]);

/* ---------- Dados ---------- */
const LOTE={};
const COORD_FIM='&timezone=Atlantic%2FAzores&past_days=1&forecast_days=7';
// Previsão de todos os locais da ilha numa só consulta (em blocos de 40): o mapa e o relatório usam os mesmos dados
async function pedir(url,coords,vars){
  const blocos=[];for(let i=0;i<coords.length;i+=40)blocos.push(coords.slice(i,i+40));
  const rs=await Promise.all(blocos.map(b=>fetch(`${url}?latitude=${b.map(c=>c[0]).join(',')}&longitude=${b.map(c=>c[1]).join(',')}${COORD_FIM}${vars}`).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})));
  return rs.flatMap(j=>Array.isArray(j)?j:[j]);
}
async function obterLote(locs){
  const R=Math.PI/180,base=locs.map(l=>[l[1],l[2]]);
  // o modelo do mar só tem dados ao largo: desloca ~6 km para o lado do mar
  const mar=locs.map(([,lat,lon,face])=>face==null?[lat,lon]:[+(lat+.06*Math.cos(face*R)).toFixed(4),+(lon+.06*Math.sin(face*R)/Math.cos(lat*R)).toFixed(4)]);
  const[rf,rm]=await Promise.allSettled([
    pedir('https://api.open-meteo.com/v1/forecast',base,'&wind_speed_unit=kmh&hourly=pressure_msl,wind_speed_10m,wind_gusts_10m,cloud_cover,precipitation,wind_direction_10m&daily=sunrise,sunset'),
    pedir('https://marine-api.open-meteo.com/v1/marine',mar,'&hourly=wave_height,wave_direction,wave_period,sea_surface_temperature,sea_level_height_msl')]);
  if(rf.status!=='fulfilled')throw new Error('Sem dados meteorológicos');
  return{rf:rf.value,rm:rm.status==='fulfilled'?rm.value:[]};
}
// Constrói os dias de um local a partir dos dados em bruto (rf = tempo, rm = mar)
function construir(loc,rf,rm){
  const[,lat,lon,face,desf=0,fator=1,modelo]=loc,R=Math.PI/180;
  const horas={};
  const juntar=(src,mapa)=>{if(!src?.hourly)return;src.hourly.time.forEach((t,i)=>{
    const dia=t.slice(0,10),h=+t.slice(11,13);horas[dia]??={};horas[dia][h]??={};
    for(const k in mapa)horas[dia][h][mapa[k]]=src.hourly[k][i];});};
  juntar(rf,{pressure_msl:'p',wind_speed_10m:'v',wind_gusts_10m:'raj',cloud_cover:'nuv',precipitation:'chuva',wind_direction_10m:'vd'});
  juntar(rm,{wave_height:'onda',wave_direction:'od',wave_period:'per',sea_surface_temperature:'sst',sea_level_height_msl:'mare'});
  const sun={},mm=t=>+t.slice(11,13)*60+ +t.slice(14,16);
  rf.daily.time.forEach((t,i)=>{sun[t]={nasce:mm(rf.daily.sunrise[i]),poe:mm(rf.daily.sunset[i])}});
  const hoje=new Date().toLocaleDateString('sv-SE',{timeZone:'Atlantic/Azores'});
  return{dias:Object.keys(horas).sort().filter(x=>x>=hoje).slice(0,7).map(data=>{
    const d={data};
    ['p','v','raj','nuv','chuva','onda','per','sst','mare','vd','od'].forEach(k=>d[k]=HORAS.map(h=>horas[data][h]?.[k]));
    // pressão com contexto: últimas horas do dia anterior + as 24 h do dia
    const ant=new Date(new Date(data+'T12:00:00Z')-864e5).toISOString().slice(0,10);
    d.pCtx=[...HORAS.slice(24-JANELA).map(h=>horas[ant]?.[h]?.p),...d.p];
    const dep=new Date(new Date(data+'T12:00:00Z').getTime()+864e5).toISOString().slice(0,10);
    d.mareCtx=[horas[ant]?.[22]?.mare,horas[ant]?.[23]?.mare,...d.mare,horas[dep]?.[0]?.mare,horas[dep]?.[1]?.mare]; // índice h+2 = hora h
    if(modelo){const t0=t0Dia(data);d.mare=HORAS.map(h=>nivelMare(t0+h*36e5,fator,modelo));d.mareCtx=Array.from({length:28},(_,i)=>nivelMare(t0+(i-2)*36e5,fator,modelo));d.modeloMare=modelo}
    d.vRaw=d.v.slice(); // vento antes do ajuste de abrigo do local
    d.sun=sun[data];d.desf=desf;d.sol=solunar(data,lat,lon);
    if(face!=null){ // exposição do local: ondas e vento de frente para a costa pesam mais
      const ex=a=>a==null?null:Math.max(0,Math.cos((a-face)*R));
      d.ondaLargo=d.onda.slice();
      d.onda=d.onda.map((x,i)=>ex(d.od[i])==null||x==null?x:x*(.35+.65*ex(d.od[i])));
      ['v','raj'].forEach(k=>d[k]=d[k].map((x,i)=>ex(d.vd[i])==null||x==null?x:x*(.6+.4*ex(d.vd[i]))));
    }
    return pontuar(d);
  }),marinho:!!rm?.hourly};
}

/* ---------- Pontuação ---------- */
function calcular(d){
  const mods=MODULOS.map(m=>({m,r:m.avaliar(d)})),ok=mods.filter(x=>x.r);
  let t=ok.reduce((s,x)=>s+x.m.peso*x.r.pontos,0)/ok.reduce((s,x)=>s+x.m.peso,0);
  const av=[],hs=mx(d.onda),rj=mx(d.raj);
  if((hs!=null&&hs>=3)||(rj!=null&&rj>=65)){t=Math.min(t,20);av.push('Condições perigosas na margem (ondulação ou rajadas extremas). Não recomendado pescar.');}
  else if((hs!=null&&hs>=2.2)||(rj!=null&&rj>=50)){t=Math.min(t,45);av.push('Risco para quem pesca nas rochas: ondulação ou rajadas fortes. Pesque só em locais abrigados.');}
  return{mods,ok:ok.length,total:Math.round(t),avisos:av};
}
// Sub-período do dia (horas a..b-1) com os mesmos dados
function fatiar(d,a,b){
  const o={data:d.data,sol:d.sol,hs:d.hs,extremos:d.extremos,ouro:d.ouro,h0:a,h1:b,p:d.p.slice(a,b),pCtx:d.pCtx.slice(a,b+JANELA)};
  ['v','raj','nuv','chuva','onda','per','sst','vRaw','vd','od'].forEach(k=>o[k]=d[k].slice(a,b));
  return o;
}
function pontuar(d){

/* ---------- Freguesias (GEO API PT, Carta Administrativa Oficial) ----------

   que não pertencem a nenhuma freguesia vizinha; a orientação da costa (para onde está virado o mar) vem do eixo principal desses vértices. */
const MUNIC={"Santa Maria":["Vila do Porto"],"São Miguel":["Lagoa","Nordeste","Ponta Delgada","Povoação","Ribeira Grande","Vila Franca do Campo"],
 "Terceira":["Angra do Heroísmo","Praia da Vitória"],"Graciosa":["Santa Cruz da Graciosa"],"São Jorge":["Calheta","Velas"],
 "Pico":["Lajes do Pico","Madalena","São Roque do Pico"],"Faial":["Horta"],"Flores":["Lajes das Flores","Santa Cruz das Flores"],"Corvo":["Corvo"]};
const FREG={};
const ROSA=['Norte','Nordeste','Leste','Sudeste','Sul','Sudoeste','Oeste','Noroeste'];
const lado=a=>ROSA[Math.round(a/45)%8];
const curto=a=>['N','NE','E','SE','S','SO','O','NO'][Math.round(a/45)%8];
// Direção média (de onde vem o vento/as ondas), ponderada pela intensidade: vd = graus de onde sopra, w = intensidade
function dirMedia(vd,w){
  if(!vd||!w)return null;let sx=0,sy=0;
  vd.forEach((a,i)=>{const k=w[i];if(a==null||k==null)return;sx+=k*Math.sin(a*Math.PI/180);sy+=k*Math.cos(a*Math.PI/180)});
  return sx||sy?(Math.atan2(sx,sy)*180/Math.PI+360)%360:null;
}
const seta=a=>`<span style="display:inline-block;transform:rotate(${Math.round(a-90)}deg)">→</span>`; // a = azimute para onde aponta
const ventoTxt=d=>{const w=d.vRaw||d.v,dv=dirMedia(d.vd,w);return dv==null?'':`${seta((dv+180)%360)} ${curto(dv)} ${f(avg(w))} km/h`};
function faixaSetas(titulo,dirs,w,un,dec,leg){ // direção de 3 em 3 horas; dirs = graus de onde vem, w = intensidade
  if(!dirs||!w||dirMedia(dirs,w)==null)return'';
  let g='';
  for(let h=0;h<24;h+=3){
    const a=dirMedia(dirs.slice(h,h+3),w.slice(h,h+3));if(a==null)continue;
    const x=46+(h+1.5)/24*(640-46-14);
    g+=`<g transform="translate(${x.toFixed(1)},26) rotate(${Math.round((a+180)%360)})"><path d="M0,-16 L7,-4 L2,-4 L2,14 L-2,14 L-2,-4 L-7,-4 Z" fill="var(--g1)"/></g><text x="${x.toFixed(1)}" y="56" text-anchor="middle" style="font-size:11px">${curto(a)}</text><text x="${x.toFixed(1)}" y="70" text-anchor="middle" style="font-size:10px;fill:var(--mute)">${f(avg(w.slice(h,h+3)),dec)} ${un}</text>`;
  }
  return`<figure class="fig"><figcaption>${titulo}</figcaption><svg class="graf" viewBox="0 0 640 78" role="img" aria-label="${titulo}">${g}</svg><div class="leg"><span>${leg}</span></div></figure>`;
}
const setasVento=d=>faixaSetas('Direção do vento a cada 3 horas',d.vd,d.vRaw||d.v,'km/h',0,'A seta aponta para onde sopra o vento; a letra indica de onde vem.');
const setasOnda=d=>faixaSetas('Direção da ondulação a cada 3 horas (ao largo)',d.od,d.ondaLargo||d.onda,'m',1,'A seta aponta para onde viajam as ondas; a letra indica de onde vêm. Altura das ondas ao largo.');
// Uma freguesia com costas viradas para lados diferentes (ex.: Rosais, em São Jorge) dá um local por lado: «Rosais (Norte)», «Rosais (Sul)».
function costasDaIlha(feats){
  const cont=new Map(),R=Math.PI/180,k5=p=>p[0].toFixed(5)+','+p[1].toFixed(5);
  const aneis=g=>(g.type==='MultiPolygon'?g.coordinates:[g.coordinates]).map(q=>q[0]);
  feats.forEach(f=>aneis(f.geometry).forEach(a=>new Set(a.map(k5)).forEach(k=>cont.set(k,(cont.get(k)||0)+1))));
  const conta={};feats.forEach(f=>conta[f.properties.Freguesia]=(conta[f.properties.Freguesia]||0)+1);
  const lista=[];
  feats.forEach(f=>{
    const segs=[];
    aneis(f.geometry).forEach(anel=>{
      const pts=anel.slice(0,-1),n=pts.length;if(n<4)return;
      const o=pts[0],xy=pts.map(p=>[(p[0]-o[0])*Math.cos(o[1]*R)*111320,(p[1]-o[1])*110574]);
      let area=0;for(let i=0;i<n;i++){const a=xy[i],b=xy[(i+1)%n];area+=a[0]*b[1]-b[0]*a[1]}
      const sg=area>0?1:-1; // sentido do anel: define de que lado fica o mar
      const uni=pts.map(p=>cont.get(k5(p))===1),ini=uni.indexOf(false);
      const ordem=[...Array(n).keys()].map(i=>ini<0?i:(i+ini+1)%n);
      const runs=[];let run=[];
      ordem.forEach(i=>{if(uni[i])run.push(i);else{if(run.length)runs.push(run);run=[]}});
      if(run.length)runs.push(run);
      runs.forEach(r=>{ // r = troço contínuo de litoral
        const P=r.map(i=>xy[i]),L=[0];
        for(let i=1;i<P.length;i++)L.push(L[i-1]+Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]));
        if(L[L.length-1]<1000)return; // ilhéus e rochas
        const nor=P.map((_,i)=>{ // normal para o mar, com a tangente medida numa janela de ±300 m
          let a=Math.max(0,i-1),b=Math.min(P.length-1,i+1); // pelo menos os vizinhos imediatos, mesmo com vértices muito espaçados
          while(a>0&&L[i]-L[a-1]<=300)a--;while(b<P.length-1&&L[b+1]-L[i]<=300)b++;
          const dx=P[b][0]-P[a][0],dy=P[b][1]-P[a][1],h=Math.hypot(dx,dy)||1;return[sg*dy/h,-sg*dx/h];
        });
        let cur={i0:0,sx:0,sy:0};const ss=[];
        nor.forEach((u,i)=>{ // novo troço sempre que a direção se afasta mais de 70° da média do troço
          const mm=Math.hypot(cur.sx,cur.sy);
          if(i>0&&mm>0&&(u[0]*cur.sx+u[1]*cur.sy)/mm<Math.cos(70*R)){cur.i1=i-1;ss.push(cur);cur={i0:i,sx:0,sy:0}}
          cur.sx+=u[0];cur.sy+=u[1];
        });
        cur.i1=P.length-1;ss.push(cur);
        ss.forEach(g=>{
          const mid=r.find((_,k)=>L[k]>=(L[g.i0]+L[g.i1])/2)??r[g.i0],m=Math.hypot(g.sx,g.sy)||1;
          segs.push({len:L[g.i1]-L[g.i0],ux:g.sx/m,uy:g.sy/m,p:pts[mid]});
        });
      });
    });
    const tot=segs.reduce((t,x)=>t+x.len,0);if(!segs.length)return;
    segs.sort((a,b)=>b.len-a.len);
    const fortes=segs.filter(x=>x.len>=Math.max(500,.15*tot)),grupos=[]; // descarta pontas curtas
    (fortes.length?fortes:[segs[0]]).forEach(x=>{ // junta troços virados para o mesmo lado
      const g=grupos.find(g=>(x.ux*g.gx+x.uy*g.gy)/(Math.hypot(g.gx,g.gy)||1)>Math.cos(60*R));
      if(g){g.gx+=x.ux*x.len;g.gy+=x.uy*x.len}else grupos.push({gx:x.ux*x.len,gy:x.uy*x.len,p:x.p});
    });
    const base=conta[f.properties.Freguesia]>1?`${f.properties.Freguesia} (${f.properties.Concelho})`:f.properties.Freguesia;
    const usados={};
    grupos.forEach(g=>{
      const face=Math.round((Math.atan2(g.gx,g.gy)/R+360)%360),l=lado(face);
      usados[l]=(usados[l]||0)+1;
      const nome=grupos.length>1?`${base} (${l}${usados[l]>1?' '+usados[l]:''})`:base;
      lista.push([nome,+g.p[1].toFixed(4),+g.p[0].toFixed(4),face,f.properties.Concelho]);
    });
  });
  return lista.sort((a,b)=>a[0].localeCompare(b[0],'pt'));
}
const GEOM={};
function simplifica(P,tol){ // Douglas-Peucker (iterativo)
  const n=P.length,keep=new Uint8Array(n);let st=[[0,n-1]];keep[0]=keep[n-1]=1;
  if(P[0][0]===P[n-1][0]&&P[0][1]===P[n-1][1]){ // anel fechado: divide no ponto mais afastado do início
    let ix=0,m=-1;for(let i=1;i<n-1;i++){const d=Math.hypot(P[i][0]-P[0][0],P[i][1]-P[0][1]);if(d>m){m=d;ix=i}}
    keep[ix]=1;st=[[0,ix],[ix,n-1]];
  }
  while(st.length){
    const[a,b]=st.pop(),dx=P[b][0]-P[a][0],dy=P[b][1]-P[a][1],l=Math.hypot(dx,dy)||1e-12;let m=0,ix=-1;
    for(let i=a+1;i<b;i++){const d=Math.abs((P[i][0]-P[a][0])*dy-(P[i][1]-P[a][1])*dx)/l;if(d>m){m=d;ix=i}}
    if(m>tol){keep[ix]=1;st.push([a,ix],[ix,b])}
  }
  return P.filter((_,i)=>keep[i]);
}
async function carregarFreguesias(ilha){
  if(FREG[ilha])return;
  try{const c=JSON.parse(localStorage.getItem('freg4|'+ilha)||'null');if(c?.length){FREG[ilha]=c;GEOM[ilha]=JSON.parse(localStorage.getItem('geom4|'+ilha)||'[]');return}}catch(e){}
  try{
    const feats=[];
    for(const m of MUNIC[ilha]){
      const r=await fetch(`https://json.geoapi.pt/municipio/${encodeURIComponent(m)}/freguesias`);
      if(!r.ok)throw new Error('GEO API PT '+r.status);
      const j=await r.json();
      // só os Açores (longitude a oeste de 24° O): há concelhos com o mesmo nome na Madeira
      feats.push(...(j.geojsons?.freguesias||[]).filter(f=>avg(aneisX(f.geometry))<-24));
    }
    const lista=costasDaIlha(feats);
    if(lista.length){
      FREG[ilha]=lista;
      GEOM[ilha]=feats.map(f=>[f.properties.Freguesia,(f.geometry.type==='MultiPolygon'?f.geometry.coordinates:[f.geometry.coordinates]).map(q=>simplifica(q[0],.0007).map(p=>[+p[0].toFixed(4),+p[1].toFixed(4)])).filter(a=>a.length>3)]);
      try{localStorage.setItem('freg4|'+ilha,JSON.stringify(lista))}catch(e){}
      try{localStorage.setItem('geom4|'+ilha,JSON.stringify(GEOM[ilha]))}catch(e){}
    }
  }catch(e){console.warn('GEO API PT indisponível; a usar a lista incluída no programa.',e)}
}
const aneisX=g=>(g.type==='MultiPolygon'?g.coordinates:[g.coordinates]).flatMap(q=>q[0].map(p=>p[0]));

/* ---------- Mapa da ilha: freguesias, orientação da costa e abrigo ao vento e às ondas ---------- */
function desenharMapa(){
  const el=$('#mapa'),ilha=sel.value,R=Math.PI/180;
  const spots=locaisDe(ilha).map((l,i)=>({i,n:l[0],lat:l[1],lon:l[2],face:l[3]})).filter(x=>x.face!=null);
  const geo=GEOM[ilha]||[],pts=geo.length?geo.flatMap(g=>g[1].flat()):spots.map(x=>[x.lon,x.lat]);
  if(!pts.length){el.innerHTML='';return}
  const lo0=Math.min(...pts.map(p=>p[0])),lo1=Math.max(...pts.map(p=>p[0])),la0=Math.min(...pts.map(p=>p[1])),la1=Math.max(...pts.map(p=>p[1]));
  const k=Math.cos((la0+la1)/2*R),dx=(lo1-lo0)*k,dy=la1-la0,pad=.08*Math.max(dx,dy,.01),sw=dx+2*pad,sh=dy+2*pad;
  const e=Math.min(620/sw,380/sh),W=Math.round(sw*e)+20,H=Math.round(sh*e)+20;
  const X=lon=>(10+((lon-lo0)*k+pad)*e).toFixed(1),Y=lat=>(10+((la1-lat)+pad)*e).toFixed(1);
  // cada local usa a sua própria previsão (vento e ondas ao largo do dia escolhido), por isso as cores não dependem do local selecionado
  const prev=x=>{const dd=estado.lote?.[x.i]?.dias?.[estado.sel];if(!dd)return null;
    const w=dd.vRaw||dd.v,ow=dd.ondaLargo||dd.onda,dv=dirMedia(dd.vd,w),dO=dirMedia(dd.od,ow),vv=avg(w),hO=avg(ow);
    if(dv==null)return null;
    const ev=Math.max(0,Math.cos((dv-x.face)*R))*Math.min(1,vv/35),eo=dO==null?0:Math.max(0,Math.cos((dO-x.face)*R))*Math.min(1,(hO||0)/2);
    return{ex:Math.max(ev,eo),dv,vv,dO,hO}};
  const cor=v=>v==null?'var(--mute)':v<.25?'var(--c1)':v<.55?'var(--c3)':'var(--c5)';
  const atual=+$('#local').value;
  let g=geo.map(([,aneis])=>`<path class="ilha" d="${aneis.map(a=>a.map((p,i)=>(i?'L':'M')+X(p[0])+','+Y(p[1])).join('')+'Z').join('')}"/>`).join('');
  spots.forEach(x=>{
    const pr=prev(x),ex=pr?.ex??null,c=cor(ex),sx=X(x.lon),sy=Y(x.lat),on=x.i===atual;
    g+=`<g class="pt" data-i="${x.i}" transform="translate(${sx},${sy})"><title>${x.n}: costa virada a ${lado(x.face)}${pr?`; vento de ${lado(pr.dv)} ${f(pr.vv)} km/h${pr.dO!=null?`, ondas de ${lado(pr.dO)} ${f(pr.hO,1)} m`:''}; exposição ${Math.round(ex*100)}%`:''}</title>
      <g transform="rotate(${x.face})"><path d="M0,0 L0,-19 M0,-19 L-4,-12 M0,-19 L4,-12" stroke="${c}" stroke-width="2" fill="none"/></g>
      ${on?'<circle r="10" fill="none" stroke="var(--ink)" stroke-width="2"/>':''}<circle r="6" fill="${c}" stroke="var(--card)" stroke-width="1.5"/>
      ${spots.length<=20||on?`<text x="9" y="3">${x.n}</text>`:''}</g>`;
  });
  g+=`<text x="${W-28}" y="16" style="font-size:11px">N ↑</text>`;
  const sp=prev(spots.find(x=>x.i===atual)||{face:0,i:-1});
  const leg=`<div class="leg"><span><i style="background:var(--c1)"></i>abrigado</span><span><i style="background:var(--c3)"></i>parcialmente exposto</span><span><i style="background:var(--c5)"></i>exposto</span>
    ${sp&&spots.some(x=>x.i===atual)?`<span>Local escolhido: vento ${seta((sp.dv+180)%360)} de ${lado(sp.dv)}, ${f(sp.vv)} km/h</span>${sp.dO!=null?`<span>ondas de ${lado(sp.dO)}, ${f(sp.hO,1)} m</span>`:''}`:''}</div>
    <div class="leg"><span>A seta de cada local aponta para o mar. A cor usa a previsão do próprio local (vento e ondas do dia escolhido) e a orientação da costa. Clique num local para o selecionar.</span></div>`;
  el.innerHTML=`<summary>Mapa dos locais de pesca${estado.lote?' (cor = abrigo no dia escolhido)':''}</summary><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapa da ilha com os locais de pesca">${g}</svg>${leg}`;
  el.onclick=ev=>{const t=ev.target.closest('[data-i]');if(!t)return;$('#local').value=t.dataset.i;$('#local').onchange()};
}

    <div class="big">${d.total}<small>%</small><span>${t.n}</span></div></div>
    ${d.avisos.map(a=>`<p class="aviso">${a}</p>`).join('')}
    <p class="resumo">${forte&&fraco&&forte!==fraco?`Ponto mais favorável: <b>${forte.m.nome.toLowerCase()}</b> (${Math.round(forte.r.pontos)}%). Ponto mais fraco: <b>${fraco.m.nome.toLowerCase()}</b> (${Math.round(fraco.r.pontos)}%).`:''}</p>
    <p class="resumo">Melhor período do dia: <b>${bp.nome.toLowerCase()}</b> (${bp.total}%).</p>${pers}${mods}
  </section>`;
  document.querySelectorAll('details.mod').forEach(x=>x.ontoggle=()=>x.open?abertos.add(x.dataset.id):abertos.delete(x.dataset.id));
  document.querySelectorAll('.dia').forEach(b=>b.onclick=()=>{estado.sel=+b.dataset.i;render();$('.dia[aria-pressed=true]').focus()});

try{sel.value=localStorage.getItem('ilha')||'São Miguel'}catch(e){sel.value='São Miguel'}
const chave=(n=$('#local').selectedOptions[0]?.text)=>`desf3|${$('#ilha').value}|${n}`;
function calibrar(){ // compara a hora oficial com a preia-mar do modelo mais próxima (sem ajuste) e guarda a diferença
  const v=$('#hora').value,d=estado.dias[0];if(!v||!d)return;
  const alvo=+v.slice(0,2)*60+ +v.slice(3,5),altas=extremos({...d,desf:0}).filter(e=>e.alta);if(!altas.length)return;
  const e=altas.reduce((a,b)=>Math.abs(b.m-alvo)<Math.abs(a.m-alvo)?b:a);
  try{localStorage.setItem(chave(),Math.round(alvo-e.m))}catch(x){}
  carregar();
}
function preencherLocais(nome){const l=$('#local');l.innerHTML='';locaisDe(sel.value).forEach(([n],i)=>l.add(new Option(n,i)));const o=[...l.options].find(x=>x.text===nome);l.value=o?o.value:0}
try{alvoLocal=localStorage.getItem('local')||''}catch(e){}
preencherLocais(alvoLocal);
const escolher=()=>{alvoLocal=$('#local').selectedOptions[0]?.text||'';carregar()};
sel.onchange=()=>{alvoLocal='';preencherLocais('');carregar()};$('#local').onchange=escolher;$('#rf').onclick=()=>carregar(true);$('#cal').onclick=calibrar;
$('#rep').onclick=()=>{try{localStorage.removeItem(chave())}catch(x){}carregar()};
carregar();
</script>
</body>
</html>
